<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Startup IQ Assessment</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Sora:wght@600;700&display=swap">
<style>
/* Startup IQ – single light theme by design (white/off-white with blue, lavender, purple). */
:root {
  --bg: #faf9ff;
  --surface: #ffffff;
  --ink: #1f1b3d;
  --muted: #6a6690;
  --line: #e7e4f6;
  --blue: #6b8cf2;
  --blue-soft: #eaf0ff;
  --lav: #b7a6f4;
  --lav-soft: #f1edff;
  --purple: #7b5be3;
  --purple-deep: #5b3fc4;
  --indigo: #3f3a8f;
  --ok: #2f8f83;
  --ok-soft: #e4f4f1;
  --bad: #d14a72;
  --bad-soft: #fdebf1;
  --warn: #a8700f;
  --warn-soft: #fff3d6;
  --pa: #5f86ee;
  --pb: #9a7bea;
  --pc: #7b5be3;
  --pd: #4b3fb0;
  --shadow: 0 1px 2px rgba(60, 40, 140, .06), 0 14px 34px -14px rgba(91, 63, 196, .25);
  --r: 18px;
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Sora", "Plus Jakarta Sans", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.55 var(--font);
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 56px;
  min-height: 100%;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--bg); }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--purple) 55%, white); outline-offset: 2px; border-radius: 8px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* floating background */
.bg { position: fixed; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }
.orb { position: absolute; border-radius: 50%; filter: blur(70px); opacity: .5; animation: drift 26s ease-in-out infinite alternate; }
.o1 { width: 380px; height: 380px; background: #cfdcff; top: -120px; left: -100px; }
.o2 { width: 340px; height: 340px; background: #e0d6ff; top: 38%; right: -140px; animation-duration: 32s; }
.o3 { width: 300px; height: 300px; background: #d9e4ff; bottom: -120px; left: 22%; animation-duration: 29s; }
@keyframes drift { to { transform: translate(40px, 30px) scale(1.08); } }

/* screens */
.wrap { max-width: 1120px; margin-inline: auto; }
.screen { animation: rise .5s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.brand { display: inline-flex; align-items: center; gap: 10px; font: 700 18px var(--display); color: var(--ink); }
.logo { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #fff; font: 700 13px var(--display);
  background: linear-gradient(135deg, var(--blue), var(--purple)); box-shadow: 0 6px 14px -6px rgba(91, 63, 196, .6); }
.eyebrow { font: 600 11px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--purple); }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 20px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; transition: transform .15s, box-shadow .2s, background .2s, border-color .2s; }
.btn:hover { transform: translateY(-1px); border-color: var(--lav); box-shadow: 0 8px 18px -10px rgba(91, 63, 196, .45); }
.btn:active { transform: none; }
.btn.primary { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%); box-shadow: 0 10px 22px -10px rgba(91, 63, 196, .7); }
.btn.primary:hover { box-shadow: 0 14px 26px -10px rgba(91, 63, 196, .8); filter: saturate(1.1); }
.btn.ghost { background: transparent; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn.lg { min-height: 52px; padding: 0 28px; font-size: 16px; border-radius: 14px; }
.btn.danger { background: var(--bad); color: #fff; border-color: transparent; }

/* welcome */
.hero { padding: clamp(24px, 5vw, 48px); margin-top: 8px; display: grid; gap: 28px; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.hero h1 { font-size: clamp(30px, 5vw, 46px); margin: 14px 0 12px; }
.hero h1 span { background: linear-gradient(120deg, var(--blue), var(--purple)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lede { color: var(--muted); max-width: 52ch; font-size: 16px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 26px; }
.stat { background: var(--lav-soft); border-radius: 14px; padding: 10px 16px; min-width: 96px; }
.stat b { display: block; font: 700 22px var(--display); color: var(--purple-deep); }
.stat span { font-size: 12px; color: var(--muted); }
.parts-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.parts-table th { text-align: left; font: 600 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 0 8px 8px 0; }
.parts-table td { padding: 10px 8px 10px 0; border-top: 1px solid var(--line); vertical-align: middle; }
.parts-table td:last-child, .parts-table th:last-child { text-align: right; padding-right: 0; }
.pchip { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: #fff; font: 700 12px var(--display); }
.pA { background: var(--pa); } .pB { background: var(--pb); } .pC { background: var(--pc); } .pD { background: var(--pd); }
.side-card { padding: 22px; }
.side-card h3 { font-size: 16px; margin-bottom: 14px; }
.notice { margin-top: 18px; padding: 14px 16px; border-radius: 14px; background: var(--blue-soft); font-size: 13.5px; color: #34407a; }
.resume { margin-top: 18px; padding: 16px; border-radius: 14px; background: var(--warn-soft); border: 1px solid #f1dca4; display: grid; gap: 12px; }
.resume b { color: var(--warn); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* details */
.narrow { max-width: 760px; margin-inline: auto; }
.form-card { padding: clamp(22px, 4vw, 40px); margin-top: 24px; }
.form-card h2 { font-size: 26px; margin: 10px 0 6px; }
.fields { display: grid; gap: 16px; margin: 22px 0; }
.field label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.field small { color: var(--muted); font-weight: 400; }
.input, .textarea { width: 100%; font: inherit; color: var(--ink); background: #fcfbff; border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; transition: border-color .2s, box-shadow .2s; }
.input:focus, .textarea:focus { outline: none; border-color: var(--purple); box-shadow: 0 0 0 4px rgba(123, 91, 227, .15); }
.input.bad { border-color: var(--bad); }
.err { color: var(--bad); font-size: 13px; margin-top: 5px; min-height: 0; }
.rules { margin: 0 0 8px; padding: 16px 18px 16px 34px; background: var(--lav-soft); border-radius: 14px; font-size: 14px; color: #3d3870; display: grid; gap: 6px; }

/* test header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(10px);
  border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px 16px; display: grid; gap: 10px; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; margin-bottom: 18px; }
.top .title { font: 600 13px var(--font); color: var(--muted); display: none; }
.prog { min-width: 0; }
.prog-line { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 6px; flex-wrap: wrap; }
.prog-line b { color: var(--ink); }
.bar { height: 8px; border-radius: 99px; background: var(--lav-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--blue), var(--purple)); transition: width .5s cubic-bezier(.2, .7, .2, 1); }
.timer { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 12px; background: var(--blue-soft); color: var(--indigo); font: 700 17px var(--display); transition: background .3s, color .3s; }
.timer.warn { background: var(--warn-soft); color: var(--warn); }
.timer.danger { background: var(--bad-soft); color: var(--bad); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .72; } }
.top .btn.sm { min-height: 38px; padding: 0 14px; font-size: 14px; }
.top-actions { display: flex; gap: 8px; align-items: center; }

.grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
.q-card { padding: clamp(20px, 3.5vw, 34px); min-height: 360px; }
.q-card.enter { animation: rise .35s cubic-bezier(.2, .7, .2, 1) both; }
.q-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 18px; }
.tag { display: inline-flex; align-items: center; gap: 6px; font: 600 12px var(--font); padding: 5px 10px; border-radius: 99px; background: var(--lav-soft); color: var(--purple-deep); }
.tag.part { color: #fff; }
.tag.marks { background: var(--blue-soft); color: var(--indigo); }
.tag.review { background: var(--warn-soft); color: var(--warn); }
.qn { font: 600 13px var(--font); color: var(--muted); margin-bottom: 6px; }
.qtext { font: 600 clamp(18px, 2.6vw, 22px)/1.4 var(--display); margin-bottom: 8px; letter-spacing: -.005em; }
.qhint { color: var(--muted); font-size: 13.5px; margin-bottom: 20px; }
.opts { display: grid; gap: 10px; margin-top: 18px; }
.opt { display: flex; gap: 14px; align-items: flex-start; padding: 14px 16px; border: 1.5px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; transition: border-color .2s, background .2s, transform .15s, box-shadow .2s; }
.opt:hover { border-color: var(--lav); transform: translateY(-1px); box-shadow: 0 8px 18px -12px rgba(91, 63, 196, .5); }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.opt .badge { flex: none; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; background: var(--lav-soft); color: var(--purple-deep); font: 700 13px var(--display); transition: background .2s, color .2s; }
.opt .otext { padding-top: 3px; min-width: 0; overflow-wrap: anywhere; }
.opt.sel { border-color: var(--purple); background: linear-gradient(180deg, #f7f4ff, #f1edff); box-shadow: 0 0 0 3px rgba(123, 91, 227, .12); }
.opt.sel .badge { background: var(--purple); color: #fff; }
.opt:has(input:focus-visible) { outline: 3px solid color-mix(in srgb, var(--purple) 55%, white); outline-offset: 2px; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 18px 0 20px; }
.tfrow .opt { justify-content: center; align-items: center; font: 700 15px var(--display); letter-spacing: .06em; padding: 16px; }
.textarea { resize: vertical; min-height: 140px; line-height: 1.55; }
.textarea.short { min-height: 88px; }
.lbl { font-weight: 600; font-size: 14px; display: block; margin-bottom: 8px; }
.saved { font-size: 12px; color: var(--muted); margin-top: 8px; }

.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 18px; }
.controls .grp { display: flex; gap: 10px; flex-wrap: wrap; }
.btn.flag[aria-pressed="true"] { background: var(--warn-soft); border-color: #f1dca4; color: var(--warn); }
.only-mobile { display: inline-flex; }

/* navigation panel */
.scrim { position: fixed; inset: 0; background: rgba(31, 27, 61, .35); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 49; }
.scrim.on { opacity: 1; pointer-events: auto; }
.navpanel { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; max-height: 82vh; overflow: auto; background: var(--surface);
  border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  transform: translateY(105%); transition: transform .3s cubic-bezier(.2, .7, .2, 1); box-shadow: 0 -20px 50px -20px rgba(60, 40, 140, .4); }
.navpanel.open { transform: none; }
.nav-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
.nav-head h3 { font-size: 16px; }
.counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.count { border-radius: 12px; padding: 10px 8px; text-align: center; background: var(--lav-soft); }
.count b { display: block; font: 700 20px var(--display); }
.count span { font-size: 11.5px; color: var(--muted); }
.count.a b { color: var(--purple-deep); } .count.u b { color: var(--muted); } .count.r b { color: var(--warn); }
.count.r { background: var(--warn-soft); }
.nav-part { margin-top: 14px; }
.nav-part h4 { font: 600 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.qgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 7px; }
.qb { position: relative; height: 40px; border-radius: 11px; border: 1.5px solid var(--line); background: #fff; font: 600 13px var(--font); transition: transform .12s, border-color .2s, background .2s; }
.qb:hover { transform: translateY(-1px); border-color: var(--lav); }
.qb.ans { background: var(--lav-soft); border-color: var(--lav); color: var(--purple-deep); }
.qb.cur { background: linear-gradient(135deg, var(--blue), var(--purple)); color: #fff; border-color: transparent; }
.qb.rev::after { content: ""; position: absolute; top: -4px; right: -4px; width: 12px; height: 12px; border-radius: 50%; background: #f2a93b; border: 2px solid #fff; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 5px; vertical-align: -1px; border: 1.5px solid var(--line); }
.legend .l-ans { background: var(--lav-soft); border-color: var(--lav); }
.legend .l-cur { background: var(--purple); border-color: var(--purple); }
.legend .l-rev { background: #f2a93b; border-color: #f2a93b; border-radius: 50%; }
.nav-submit { margin-top: 18px; width: 100%; }

@media (min-width: 960px) {
  .grid { grid-template-columns: minmax(0, 1fr) 310px; align-items: start; }
  .navpanel { position: sticky; top: calc(96px + env(safe-area-inset-top, 0px)); transform: none; border-radius: var(--r); border: 1px solid var(--line); box-shadow: var(--shadow); max-height: calc(100vh - 120px); padding: 18px; z-index: 1; }
  .only-mobile, .scrim, .nav-head .btn { display: none; }
  .top .title { display: block; }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .top { grid-template-columns: minmax(0, 1fr) auto; }
  .top .prog { grid-column: 1 / -1; order: 3; }
  .top .brand { display: none; }
  .tfrow .opt { padding: 14px 8px; }
}

/* modal */
.modal-wrap { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 20px; background: rgba(31, 27, 61, .45); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(460px, 100%); padding: 26px; animation: rise .3s both; }
.modal h3 { font-size: 21px; margin-bottom: 8px; }
.modal ul { list-style: none; padding: 0; margin: 16px 0; display: grid; gap: 8px; }
.modal li { display: flex; justify-content: space-between; padding: 10px 14px; border-radius: 12px; background: var(--lav-soft); }
.modal li.warn { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.modal .row { justify-content: flex-end; margin-top: 18px; }

/* report */
.report { margin-top: 8px; }
.rep-head { padding: clamp(22px, 4vw, 36px); background: linear-gradient(135deg, #f3f0ff, #eaf0ff); border-radius: var(--r); border: 1px solid var(--line); display: grid; gap: 22px; }
.rep-head h1 { font-size: clamp(26px, 4vw, 36px); margin-top: 8px; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px 22px; }
.kv div { min-width: 0; }
.kv dt { font: 600 11px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kv dd { margin: 2px 0 0; font-weight: 600; overflow-wrap: anywhere; }
.banner { margin-top: 16px; padding: 14px 18px; border-radius: 14px; background: var(--warn-soft); color: #6f4a0a; font-size: 14px; border: 1px solid #f1dca4; }
.sec { margin-top: 24px; padding: clamp(20px, 3.5vw, 30px); }
.sec > h2 { font-size: 20px; margin-bottom: 16px; }
.score-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 26px; align-items: center; }
.ring { position: relative; width: 190px; height: 190px; margin-inline: auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 14; }
.ring .trk { stroke: var(--lav-soft); }
.ring .val { stroke: url(#grad); stroke-linecap: round; stroke-dasharray: 339.29; stroke-dashoffset: 339.29; transition: stroke-dashoffset 1.2s cubic-bezier(.2, .7, .2, 1); }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .mid b { font: 700 38px var(--display); color: var(--purple-deep); }
.ring .mid span { font-size: 12px; color: var(--muted); max-width: 110px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.tile { padding: 12px 14px; border-radius: 14px; background: var(--lav-soft); min-width: 0; }
.tile b { display: block; font: 700 21px var(--display); }
.tile span { font-size: 12px; color: var(--muted); }
.tile.ok { background: var(--ok-soft); } .tile.ok b { color: var(--ok); }
.tile.bad { background: var(--bad-soft); } .tile.bad b { color: var(--bad); }
.tile.pend { background: var(--warn-soft); } .tile.pend b { color: var(--warn); }
.tile.blue { background: var(--blue-soft); }
.summary p + p { margin-top: 10px; }
.bands { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; font-size: 13px; }
.bands span { background: var(--lav-soft); border-radius: 99px; padding: 4px 12px; color: var(--muted); }
.bars { display: grid; gap: 14px; }
.brow { display: grid; grid-template-columns: minmax(130px, 280px) minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.brow .nm { font-weight: 600; font-size: 14px; display: flex; gap: 8px; align-items: center; min-width: 0; }
.brow .val { font-size: 13px; color: var(--muted); white-space: nowrap; }
.brow .bar > i { transition-duration: 1s; }
.fine { font-size: 12.5px; color: var(--muted); margin-top: 12px; }
.review { display: grid; gap: 14px; }
.ri { border: 1px solid var(--line); border-radius: 16px; padding: 18px; break-inside: avoid; page-break-inside: avoid; background: #fff; }
.ri-top { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.status { font: 700 11.5px var(--font); padding: 4px 10px; border-radius: 99px; letter-spacing: .03em; }
.st-correct { background: var(--ok-soft); color: var(--ok); }
.st-incorrect { background: var(--bad-soft); color: var(--bad); }
.st-unanswered, .st-notattempted { background: #eeedf5; color: var(--muted); }
.st-attempted { background: var(--blue-soft); color: var(--indigo); }
.ri .q { font-weight: 600; margin-bottom: 12px; }
.ans-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.abox { border-radius: 12px; padding: 10px 14px; background: #f7f6fc; min-width: 0; }
.abox small { display: block; font: 600 10.5px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.abox.good { background: var(--ok-soft); } .abox.badbox { background: var(--bad-soft); }
.abox .resp { white-space: pre-wrap; overflow-wrap: anywhere; }
.expl { margin-top: 12px; font-size: 14px; color: #3d3870; }
.expl p + p { margin-top: 8px; }
.expl small { display: block; font: 600 10.5px var(--font); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
.expl ul { margin: 6px 0 0; padding-left: 20px; }
.markline { margin-top: 10px; font-size: 13px; color: var(--muted); display: flex; gap: 8px; align-items: center; }
.markline i { display: inline-block; width: 70px; border-bottom: 1.5px solid var(--muted); }
.foot-notes { margin-top: 24px; padding: 18px 20px; border-radius: 14px; background: var(--blue-soft); font-size: 13px; color: #34407a; display: grid; gap: 6px; }
.actions { margin-top: 22px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hint { font-size: 12.5px; color: var(--muted); }

<script>
/* ------------------------------------------------------------------
   Engine: attempt creation, randomisation, persistence and scoring.
   No DOM code here, so it can be tested in Node.
   Scoring rules
   - MCQ: full marks only for the single correct option, otherwise 0. No negative marking.
   - True/False (Part B): marks for the correct choice; the written reason is manual.
   - Parts C and D (and Part B reasons): never auto-scored; marked manually.
   ------------------------------------------------------------------ */
(function (root) {
  "use strict";
  var C = root.CONFIG, QS = root.QUESTIONS;
  var byId = {};
  QS.forEach(function (q) { byId[q.id] = q; });

  function part(id) { return C.parts.filter(function (p) { return p.id === id; })[0]; }

  function marksFor(q) {
    var p = part(q.part);
    if (q.type === "mcq") return { auto: p.marksEach, manual: 0 };
    if (q.type === "tf") return { auto: p.tfMarks, manual: p.reasonMarks };
    return { auto: 0, manual: p.marksEach };
  }

  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---- persistence (localStorage, with in-memory fallback) ---- */
  var mem = null;
  function save(s) {
    mem = s;
    try { localStorage.setItem(C.storageKey, JSON.stringify(s)); } catch (e) { /* storage unavailable */ }
  }
  function load() {
    try {
      var raw = localStorage.getItem(C.storageKey);
      if (raw) { var s = JSON.parse(raw); if (s && s.order && s.participant) return s; }
    } catch (e) { /* ignore */ }
    return mem;
  }
  function clear() {
    mem = null;
    try { localStorage.removeItem(C.storageKey); } catch (e) { /* ignore */ }
  }

  /* ---- attempt creation ---- */
  function create(participant) {
    var order = [], optionOrder = {};
    C.parts.forEach(function (p) {
      var qs = QS.filter(function (q) { return q.part === p.id; });
      if (C.shuffleQuestionsWithinParts) qs = shuffle(qs);
      var lim = C.questionsPerPart[p.id];
      if (lim !== null && lim !== undefined) qs = qs.slice(0, lim);
      qs.forEach(function (q) {
        order.push(q.id);
        if (q.type === "mcq") {
          var ids = q.options.map(function (o) { return o.id; });
          optionOrder[q.id] = C.shuffleOptions ? shuffle(ids) : ids;
        }
      });
    });
    var now = Date.now();
    return {
      v: 1, phase: "test", participant: participant,
      order: order, optionOrder: optionOrder,
      answers: {}, flags: {}, idx: 0,
      startedAt: now, endAt: now + C.durationMinutes * 60000,
      submittedAt: null, autoSubmitted: false
    };
  }

  function isAnswered(q, a) {
    if (!a) return false;
    if (q.type === "written") return !!(a.text && a.text.trim());
    return !!a.choice;
  }

  function maxMarks(ids) {
    var auto = 0, manual = 0;
    ids.forEach(function (id) { var m = marksFor(byId[id]); auto += m.auto; manual += m.manual; });
    return { auto: auto, manual: manual, total: auto + manual };
  }

  /* ---- answer key (loaded lazily at submission) ---- */
  function loadKey() {
    return new Promise(function (resolve, reject) {
      if (root.ANSWER_KEY) return resolve(root.ANSWER_KEY);
      var s = document.createElement("script");
      s.src = "js/answer-key.js";
      s.onload = function () { root.ANSWER_KEY ? resolve(root.ANSWER_KEY) : reject(new Error("Answer key empty")); };
      s.onerror = function () { reject(new Error("Answer key could not be loaded")); };
      document.head.appendChild(s);
    });
  }

  /* ---- scoring ---- */
  function score(s, key) {
    var ids = s.order.slice().sort(function (a, b) { return a - b; });
    var items = [];
    var r = {
      totalQuestions: ids.length, correct: 0, incorrect: 0, unanswered: 0,
      autoQuestions: 0, writtenTotal: 0, writtenAttempted: 0, reasonsTotal: 0, reasonsWritten: 0,
      autoEarned: 0, autoMax: 0, manualMax: 0, totalMarks: 0, parts: {}, topics: {}
    };
    C.parts.forEach(function (p) { r.parts[p.id] = { id: p.id, name: p.name, questions: 0, autoEarned: 0, autoMax: 0, manualMax: 0 }; });
    C.topics.forEach(function (t) { r.topics[t.id] = { id: t.id, name: t.name, questions: 0, autoEarned: 0, autoMax: 0, manualMax: 0 }; });

    ids.forEach(function (id) {
      var q = byId[id], m = marksFor(q), a = s.answers[id] || {};
      var k = key[id], status, earned = 0;
      if (q.type === "mcq" || q.type === "tf") {
        r.autoQuestions++;
        if (!a.choice) { status = "unanswered"; r.unanswered++; }
        else if (a.choice === k.answer) { status = "correct"; earned = m.auto; r.correct++; }
        else { status = "incorrect"; r.incorrect++; }
        if (q.type === "tf") {
          r.reasonsTotal++;
          if (a.reason && a.reason.trim()) r.reasonsWritten++;
        }
      } else {
        r.writtenTotal++;
        if (a.text && a.text.trim()) { status = "attempted"; r.writtenAttempted++; }
        else status = "notattempted";
      }
      r.autoEarned += earned; r.autoMax += m.auto; r.manualMax += m.manual;
      [r.parts[q.part], r.topics[C.topicOf[id]]].forEach(function (g) {
        if (!g) return;
        g.questions++; g.autoEarned += earned; g.autoMax += m.auto; g.manualMax += m.manual;
      });
      items.push({ id: id, part: q.part, type: q.type, topic: C.topicOf[id], status: status,
        earned: earned, autoMax: m.auto, manualMax: m.manual, answer: a });
    });
    r.totalMarks = r.autoMax + r.manualMax;
    r.items = items;
    var end = s.submittedAt || Date.now();
    r.timeTakenSec = Math.max(0, Math.min(Math.round((end - s.startedAt) / 1000), C.durationMinutes * 60));
    return r;
  }

  root.Engine = {
    byId: byId, part: part, marksFor: marksFor, shuffle: shuffle,
    save: save, load: load, clear: clear, create: create,
    isAnswered: isAnswered, maxMarks: maxMarks, loadKey: loadKey, score: score
  };
})(typeof window !== "undefined" ? window : globalThis);

</script>
<script>
/* ------------------------------------------------------------------
   Startup IQ – UI. Flow: Welcome → Details → Test → Submit confirmation → Report
   ------------------------------------------------------------------ */
(function () {
  "use strict";
  var C = window.CONFIG, QS = window.QUESTIONS, E = window.Engine;

  var S = null;          // current attempt
  var KEY = null;        // answer key (only after submission)
  var ix = 0;            // current position
  var timerId = null, saveId = null;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function rich(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }
  function $(sel, root) { return (root || document).querySelector(sel); }
  function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function fmtClock(sec) {
    sec = Math.max(0, sec);
    var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    var mm = (m < 10 ? "0" : "") + m, ss = (s < 10 ? "0" : "") + s;
    return h ? h + ":" + mm + ":" + ss : mm + ":" + ss;
  }
  function fmtDuration(sec) {
    var m = Math.floor(sec / 60), s = sec % 60;
    return m + " min " + (s < 10 ? "0" : "") + s + " sec";
  }
  function mount(html, cls) {
    app.innerHTML = '<div class="screen ' + (cls || "") + '">' + html + "</div>";
    window.scrollTo(0, 0);
  }
  function queueSave() {
    clearTimeout(saveId);
    saveId = setTimeout(function () { E.save(S); }, 250);
  }
  function flushSave() { clearTimeout(saveId); if (S) E.save(S); }
  function brandHtml() { return '<span class="brand"><span class="logo">IQ</span>' + esc(C.brand) + "</span>"; }

  /* ---------- Welcome ---------- */
  function welcome() {
    stopTimer();
    var ids = []; var counts = {};
    C.parts.forEach(function (p) {
      var n = QS.filter(function (q) { return q.part === p.id; }).length;
      var lim = C.questionsPerPart[p.id];
      if (lim !== null && lim !== undefined) n = Math.min(n, lim);
      counts[p.id] = n;
      QS.filter(function (q) { return q.part === p.id; }).slice(0, n).forEach(function (q) { ids.push(q.id); });
    });
    var mm = E.maxMarks(ids);
    var saved = E.load();
    var resumeHtml = "";
    if (saved && saved.phase === "test" && Date.now() < saved.endAt) {
      resumeHtml = '<div class="resume"><div><b>Attempt in progress</b><br>' + esc(saved.participant.name) +
        " · " + fmtClock(Math.round((saved.endAt - Date.now()) / 1000)) + " remaining. Your saved answers are ready.</div>" +
        '<div class="row"><button class="btn primary" id="resume">Resume assessment</button></div></div>';
    } else if (saved && saved.phase === "submitted") {
      resumeHtml = '<div class="resume"><div><b>Submitted attempt found</b><br>' + esc(saved.participant.name) +
        " submitted an attempt in this browser.</div>" +
        '<div class="row"><button class="btn primary" id="viewrep">View report</button></div></div>';
    } else if (saved && saved.phase === "test") {
      resumeHtml = '<div class="resume"><div><b>Time ran out on a saved attempt</b><br>It will be submitted automatically so your answers are kept.</div>' +
        '<div class="row"><button class="btn primary" id="resume">Submit and view report</button></div></div>';
    }
    var rows = C.parts.map(function (p) {
      var pm = E.maxMarks(QS.filter(function (q) { return q.part === p.id; }).slice(0, counts[p.id]).map(function (q) { return q.id; }));
      return '<tr><td><span class="pchip p' + p.id + '">' + p.id + "</span></td><td>" + esc(p.name) + '</td><td class="num">' + counts[p.id] + '</td><td class="num">' + pm.total + "</td></tr>";
    }).join("");
    mount(
      '<div class="wrap">' +
      '<header class="row" style="justify-content:space-between;margin-bottom:18px">' + brandHtml() + '<span class="eyebrow">' + esc(C.series) + "</span></header>" +
      '<section class="card hero"><div>' +
      '<span class="eyebrow">Assessment</span>' +
      "<h1>" + esc(C.title.replace(/ Test$/, "")) + " <span>Test</span></h1>" +
      '<p class="lede">' + esc(C.subtitle) + ". A timed assessment of how well you understand MVP thinking, the metrics behind it, the decisions it leads to, and the Islamic principles that guide a halal business.</p>" +
      '<div class="stats"><div class="stat"><b>' + ids.length + "</b><span>Questions</span></div>" +
      '<div class="stat"><b>' + mm.total + "</b><span>Marks</span></div>" +
      '<div class="stat"><b>' + C.durationMinutes + "</b><span>Minutes</span></div>" +
      '<div class="stat"><b>' + C.parts.length + "</b><span>Parts</span></div></div>" +
      '<button class="btn primary lg" id="start">Start Assessment</button>' +
      resumeHtml + "</div>" +
      '<aside class="card side-card"><h3>What is in the test</h3>' +
      '<table class="parts-table"><thead><tr><th></th><th>Type</th><th>Qs</th><th>Marks</th></tr></thead><tbody>' + rows + "</tbody></table>" +
      '<div class="notice">Parts A and B are scored instantly. Parts C and D are written answers, marked by your examiner against the source marking points. A calculator is allowed and all figures are hypothetical unless stated.</div>' +
      "</aside></section></div>"
    );
    $("#start").onclick = details;
    var r = $("#resume"); if (r) r.onclick = function () { S = saved; resumeAttempt(); };
    var v = $("#viewrep"); if (v) v.onclick = function () { S = saved; showReport(); };
  }

  /* ---------- Participant details ---------- */
  function details() {

      '<div class="field"><label for="name">Full name</label><input class="input" id="name" autocomplete="name" maxlength="80" /><div class="err" id="e-name"></div></div>' +

      '<div class="field"><label for="pid">' + esc(C.participant.idLabel) + (idReq ? "" : " <small>(optional)</small>") + '</label><input class="input" id="pid" maxlength="40" /><div class="err" id="e-pid"></div></div>' +

      "</form></section></div>"

      function bad(id, msg) { $("#" + id).classList.add("bad"); $("#e-" + id).textContent = msg; ok = false; }

      if (idReq && !pid) bad("pid", "Enter your participant ID.");
      if (!ok) return;
      S = E.create({ name: name, email: email, id: pid });
      E.save(S);
      startTest();
    };
  }

  /* ---------- Test ---------- */
  function resumeAttempt() {
    if (Date.now() >= S.endAt) { finalize(true); return; }
    startTest();
  }

  function startTest() {
    ix = Math.min(S.idx || 0, S.order.length - 1);
    var navParts = C.parts.map(function (p) {
      var pos = [];
      S.order.forEach(function (id, i) { if (E.byId[id].part === p.id) pos.push(i); });

      return '<div class="nav-part"><h4><span class="pchip p' + p.id + '">' + p.id + "</span>" + esc(p.name) + '</h4><div class="qgrid">' +
        pos.map(function (i) { return '<button class="qb" data-i="' + i + '" aria-label="Go to question ' + (i + 1) + '">' + (i + 1) + "</button>"; }).join("") + "</div></div>";

      '<div class="wrap">' +
      '<div class="top"><div class="brand-wrap">' + brandHtml() + '</div>' +

      '<div class="top-actions"><span class="timer num" id="timer" role="timer" aria-label="Time remaining">--:--</span><button class="btn primary sm" id="submit">Submit</button></div></div>' +
      '<div class="grid"><main><section class="card q-card" id="qcard"></section></main>' +
      '<aside class="navpanel" id="nav" aria-label="Question navigation"><div class="nav-head"><h3>Questions</h3><button class="btn sm" id="closenav">Close</button></div>' +
      '<div class="counts"><div class="count a"><b class="num" id="c-a">0</b><span>Answered</span></div><div class="count u"><b class="num" id="c-u">0</b><span>Unanswered</span></div><div class="count r"><b class="num" id="c-r">0</b><span>For review</span></div></div>' +
      navParts +

  function showQ(i, animate) {

      body = '<div class="opts" role="radiogroup" aria-label="Answer options">' + S.optionOrder[q.id].map(function (oid, k) {
        var o = q.options.filter(function (x) { return x.id === oid; })[0], on = a.choice === oid;
        return '<label class="opt' + (on ? " sel" : "") + '"><input type="radio" name="q' + q.id + '" value="' + oid + '"' + (on ? " checked" : "") + '><span class="badge">' + "ABCD"[k] + '</span><span class="otext">' + esc(o.text) + "</span></label>";
      }).join("") + "</div>";
    } else if (q.type === "tf") {
      body = '<div class="tfrow" role="radiogroup" aria-label="True or false">' +
        [["T", "TRUE"], ["F", "FALSE"]].map(function (x) {
          var on = a.choice === x[0];
          return '<label class="opt' + (on ? " sel" : "") + '"><input type="radio" name="q' + q.id + '" value="' + x[0] + '"' + (on ? " checked" : "") + "><span>" + x[1] + "</span></label>";
        }).join("") + "</div>" +
        '<label class="lbl" for="reason">Reason <small style="color:var(--muted);font-weight:400">(one sentence · 1 mark)</small></label>' +
        '<textarea class="textarea short" id="reason" data-f="reason" placeholder="Why is the statement true or false?">' + esc(a.reason || "") + "</textarea>";
      hint = p.note + " 1 mark for True/False, 1 for a valid reason.";
    } else {
      body = '<label class="lbl" for="text">Your answer</label><textarea class="textarea" id="text" data-f="text" style="min-height:' + (q.part === "D" ? 240 : 190) + 'px" placeholder="' + (q.part === "C" ? "Show your working, then interpret the result." : "Write your answer here.") + '">' + esc(a.text || "") + "</textarea>";
    }
    var marksTxt = q.type === "tf" ? "2 marks" : E.marksFor(q).manual + E.marksFor(q).auto + " marks";
    var card = $("#qcard");
    card.className = "card q-card" + (animate ? " enter" : "");
    card.innerHTML =
      '<div class="q-meta"><span class="tag part p' + q.part + '">Part ' + q.part + " · " + esc(p.name) + '</span><span class="tag marks">' + marksTxt + "</span>" +
      (S.flags[q.id] ? '<span class="tag review" id="revtag">Marked for review</span>' : "") + "</div>" +
      '<div class="qn">Question ' + (i + 1) + '</div><h2 class="qtext">' + rich(q.text) + '</h2><p class="qhint">' + esc(hint) + "</p>" + body +
      (q.type !== "mcq" ? '<div class="saved">Saved automatically in this browser.</div>' : "") +
      '<div class="controls"><div class="grp"><button class="btn" id="prev"' + (i === 0 ? " disabled" : "") + '>← Previous</button>' +
      '<button class="btn only-mobile" id="opennav">Questions</button></div>' +
      '<div class="grp"><button class="btn flag" id="flag" aria-pressed="' + (!!S.flags[q.id]) + '">' + (S.flags[q.id] ? "⚑ Marked for review" : "⚐ Mark for review") + "</button>" +
      (i === S.order.length - 1 ? '<button class="btn primary" id="next">Review &amp; submit</button>' : '<button class="btn primary" id="next">Next →</button>') + "</div></div>";

    $("#prev").onclick = function () { go(ix - 1); };
    $("#next").onclick = function () { if (ix === S.order.length - 1) confirmSubmit(); else go(ix + 1); };
    $("#opennav").onclick = openNav;
    $("#flag").onclick = function () {
      if (S.flags[q.id]) delete S.flags[q.id]; else S.flags[q.id] = true;
      queueSave(); showQ(ix, false); updateNav();
    };
    $$("input[type=radio]", card).forEach(function (r) {
      r.onchange = function () {
        S.answers[q.id] = S.answers[q.id] || {};
        S.answers[q.id].choice = r.value;
        $$(".opt", card).forEach(function (l) { l.classList.toggle("sel", $("input", l).checked); });
        queueSave(); updateNav();
      };
    });
    $$("textarea", card).forEach(function (t) {
      t.oninput = function () {
        S.answers[q.id] = S.answers[q.id] || {};
        S.answers[q.id][t.dataset.f] = t.value;
        queueSave(); updateNav();
      };
    });
    updateNav();
  }

  function stats() {
    var a = 0, r = 0;
    S.order.forEach(function (id) {
      if (E.isAnswered(E.byId[id], S.answers[id])) a++;
      if (S.flags[id]) r++;
    });
    return { answered: a, unanswered: S.order.length - a, review: r, total: S.order.length };
  }

  function updateNav() {
    var st = stats();
    $("#pos").textContent = ix + 1;
    $("#ansline").innerHTML = "<b>" + st.answered + "</b> answered";
    $("#pfill").style.width = pct(st.answered, st.total) + "%";
    $("#pbar").setAttribute("aria-valuenow", pct(st.answered, st.total));
    $("#c-a").textContent = st.answered; $("#c-u").textContent = st.unanswered; $("#c-r").textContent = st.review;
    $$(".qb").forEach(function (b) {
      var i = +b.dataset.i, id = S.order[i];
      b.classList.toggle("cur", i === ix);
      b.classList.toggle("ans", E.isAnswered(E.byId[id], S.answers[id]));
      b.classList.toggle("rev", !!S.flags[id]);
      if (i === ix) b.setAttribute("aria-current", "true"); else b.removeAttribute("aria-current");
    });
  }

  /* ---------- Timer ---------- */
  function startTimer() {
    stopTimer();
    function tick() {
      var left = Math.round((S.endAt - Date.now()) / 1000);
      var t = $("#timer");
      if (t) {
        t.textContent = "⏱ " + fmtClock(left);
        t.classList.toggle("warn", left <= C.warnAtMinutes * 60 && left > C.dangerAtMinutes * 60);
        t.classList.toggle("danger", left <= C.dangerAtMinutes * 60);
      }
      if (left <= 0) finalize(true);
    }
    tick();
    timerId = setInterval(tick, 1000);
  }
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }

  /* ---------- Submit ---------- */
  function confirmSubmit() {
    closeNav();
    var st = stats();
    var wrap = document.createElement("div");
    wrap.className = "modal-wrap";
    wrap.innerHTML = '<div class="card modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h3 id="mt">Submit your assessment?</h3>' +
      '<p style="color:var(--muted)">You cannot change your answers after submitting.</p><ul>' +
      "<li><span>Answered</span><b class=\"num\">" + st.answered + " / " + st.total + "</b></li>" +
      (st.unanswered ? '<li class="warn"><span>Unanswered</span><b class="num">' + st.unanswered + "</b></li>" : "<li><span>Unanswered</span><b class=\"num\">0</b></li>") +
      (st.review ? '<li class="warn"><span>Marked for review</span><b class="num">' + st.review + "</b></li>" : "") +
      '</ul><div class="row"><button class="btn" id="keep">Keep working</button><button class="btn primary" id="yes">Submit now</button></div></div>';
    document.body.appendChild(wrap);
    $("#keep", wrap).focus();
    $("#keep", wrap).onclick = function () { wrap.remove(); };
    $("#yes", wrap).onclick = function () { wrap.remove(); finalize(false); };
  }

  function finalize(auto) {
    stopTimer();
    $$(".modal-wrap").forEach(function (m) { m.remove(); });
    if (S.phase !== "submitted") {
      S.phase = "submitted"; S.autoSubmitted = !!auto;
      S.submittedAt = auto ? Math.min(Date.now(), S.endAt) : Date.now();
    }
    flushSave();
    showReport();
  }

  /* ---------- Report ---------- */
  function showReport() {
    mount('<div class="wrap narrow"><div class="card form-card"><h2>Preparing your report…</h2></div></div>');
    E.loadKey().then(function (k) { KEY = k; renderReport(); }).catch(function (err) {
      mount('<div class="wrap narrow"><div class="card form-card"><h2>Your answers are saved</h2><p style="color:var(--muted);margin:10px 0 18px">The answer key could not be loaded, so the report cannot be built yet (' + esc(err.message) + ').</p><div class="row"><button class="btn primary" id="retry">Try again</button></div></div></div>');
      $("#retry").onclick = showReport;
    });
  }

  function bar(p) { return '<div class="bar"><i data-w="' + p + '"></i></div>'; }

  function renderReport() {
    var R = E.score(S, KEY);
    var when = new Date(S.submittedAt);
    var autoPct = pct(R.autoEarned, R.autoMax);
    var pendingTotal = R.manualMax;

    /* strongest / weakest (auto-marked) */
    function ranked(obj) {
      return Object.keys(obj).map(function (k) { return obj[k]; }).filter(function (g) { return g.autoMax > 0; })
        .map(function (g) { return { name: g.name, p: pct(g.autoEarned, g.autoMax) }; })
        .sort(function (a, b) { return b.p - a.p; });
    }
    var tr = ranked(R.topics);
    var summary = "<p>You answered <b>" + R.correct + " of " + R.autoQuestions + "</b> auto-marked questions correctly (" + R.incorrect + " incorrect, " + R.unanswered + " unanswered), earning <b>" + R.autoEarned + " of " + R.autoMax + "</b> auto-marked marks (" + autoPct + "%).</p>";
    if (tr.length > 1) {
      var best = tr[0], worst = tr[tr.length - 1];
      if (best.p === worst.p) summary += "<p>Performance was the same (" + best.p + "%) across all topics on the auto-marked questions.</p>";
      else summary += "<p>Strongest topic on auto-marked questions: <b>" + esc(best.name) + "</b> (" + best.p + "%). Weakest: <b>" + esc(worst.name) + "</b> (" + worst.p + "%).</p>";
    }
    summary += "<p>" + R.writtenAttempted + " of " + R.writtenTotal + " written questions (Parts C and D) were attempted and " + R.reasonsWritten + " of " + R.reasonsTotal + " reasons were written in Part B. These <b>" + pendingTotal + " marks</b> are awarded by the examiner, so the final score and band are not decided yet.</p>";
    var bandsHtml = C.bands.map(function (b) { return "<span>" + b.min + "–" + b.max + " " + esc(b.label) + "</span>"; }).join("");

    function groupRows(obj, tag) {
      return Object.keys(obj).map(function (k) {
        var g = obj[k]; if (!g.questions) return "";
        var p = pct(g.autoEarned, g.autoMax);
        return '<div class="brow"><div class="nm">' + (tag ? '<span class="pchip p' + g.id + '">' + g.id + "</span>" : "") + "<span>" + esc(g.name) + '</span></div>' + bar(p) +
          '<div class="val num">' + g.autoEarned + " / " + g.autoMax + " auto" + (g.manualMax ? " · " + g.manualMax + " pending" : "") + "</div></div>";
      }).join("");
    }

    var review = R.items.map(function (it) { return reviewItem(it); }).join("");

    var body =
      '<div class="wrap report"><div class="actions no-print" style="margin:0 0 16px"><button class="btn primary" id="print">Print / Save as PDF</button>' +
      '<span class="hint" id="printhint" hidden>If the print window does not open here, open the standalone file and use Print there.</span></div>' +
      '<section class="rep-head"><div><span class="eyebrow">' + esc(C.brand) + " · Individual assessment report</span><h1>" + esc(C.title) + "</h1></div>" +
      '<dl class="kv" style="margin:0">' +
      "<div><dt>Participant</dt><dd>" + esc(S.participant.name) + "</dd></div>" +
      "<div><dt>Participant ID</dt><dd>" + (S.participant.id ? esc(S.participant.id) : "Not provided") + "</dd></div>" +
      "<div><dt>Email</dt><dd>" + esc(S.participant.email) + "</dd></div>" +
      "<div><dt>Submitted</dt><dd>" + esc(when.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" })) + "</dd></div>" +
      "<div><dt>Time taken</dt><dd>" + fmtDuration(R.timeTakenSec) + " of " + C.durationMinutes + " min</dd></div>" +
      "<div><dt>Submission</dt><dd>" + (S.autoSubmitted ? "Automatic, timer expired" : "Submitted by participant") + "</dd></div></dl></section>" +
      '<div class="banner">Provisional result. Parts C and D and the Part B reasons need manual marking, so the marks below cover auto-marked questions only. Final marks = auto-marked marks + marks the examiner awards.</div>' +

      '<section class="card sec"><h2>Score</h2><div class="score-grid"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6b8cf2"/><stop offset="1" stop-color="#7b5be3"/></linearGradient></defs><circle class="trk" cx="60" cy="60" r="54"/><circle class="val" id="ringval" cx="60" cy="60" r="54" data-p="' + autoPct + '"/></svg>' +
      '<div class="mid"><b class="num">' + autoPct + '%</b><span>of auto-marked marks</span></div></div>' +
      '<div class="tiles">' +
      '<div class="tile"><b class="num">' + R.totalQuestions + "</b><span>Total questions</span></div>" +
      '<div class="tile"><b class="num">' + R.totalMarks + "</b><span>Total marks</span></div>" +
      '<div class="tile blue"><b class="num">' + R.autoEarned + " / " + R.autoMax + "</b><span>Marks obtained (auto-marked)</span></div>" +
      '<div class="tile pend"><b class="num">' + pendingTotal + "</b><span>Marks awaiting examiner</span></div>" +
      '<div class="tile ok"><b class="num">' + R.correct + "</b><span>Correct</span></div>" +
      '<div class="tile bad"><b class="num">' + R.incorrect + "</b><span>Incorrect</span></div>" +
      '<div class="tile"><b class="num">' + R.unanswered + "</b><span>Unanswered</span></div>" +
      '<div class="tile"><b class="num">' + R.autoEarned + " / " + R.totalMarks + "</b><span>Provisional total</span></div></div></div>" +
      '<p class="fine">Correct, incorrect and unanswered count the ' + R.autoQuestions + " auto-marked questions (Part A and the True/False choice in Part B). Written answers are listed separately.</p></section>" +

      '<section class="card sec summary"><h2>Overall performance summary</h2>' + summary +
      '<div class="bands" aria-label="Score bands from the source">' + bandsHtml + '</div><p class="fine">Bands are from the source answer key and apply to the final score out of 100.</p></section>' +

      '<section class="card sec"><h2>Performance by part</h2><div class="bars">' + groupRows(R.parts, true) + "</div></section>" +
      '<section class="card sec"><h2>Performance by topic</h2><div class="bars">' + groupRows(R.topics, false) + "</div>" +
      '<p class="fine">Topic grouping is proposed. The source file has no topic labels, so these groups were inferred from question content and need approval.</p></section>' +

      '<section class="card sec"><h2>Answer review</h2><p class="fine" style="margin:-6px 0 14px">Questions use their numbers from the source paper. Explanations, model answers and marking points are copied from the source answer key; none were written by this app.</p><div class="review">' + review + "</div></section>" +

      '<div class="foot-notes"><div><b>Scoring rule.</b> Part A: 2 marks for the one correct option, 0 otherwise. Part B: 1 mark for the correct True/False choice; the reason (1 mark) is marked manually. Parts C and D: marked manually, 1 mark per marking point covered. No negative marking.</div>' +
      "<div><b>Not a secure examination.</b> Answers are checked in your browser and the answer key ships with the page, so this is suitable for practice or supervised internal use, not a high-stakes exam. Responses are stored only in this browser, with no server, so nothing here is permanently or securely saved.</div></div>" +
      '<div class="actions no-print"><button class="btn" id="newattempt">Start a new attempt</button></div></div>';
    mount(body);

    requestAnimationFrame(function () {
      setTimeout(function () {
        var rv = $("#ringval"); if (rv) rv.style.strokeDashoffset = String(339.29 * (1 - (+rv.dataset.p) / 100));
        $$("[data-w]").forEach(function (b) { b.style.width = b.dataset.w + "%"; });
      }, 80);
    });
    $("#print").onclick = function () {
      /* show final state for print */
      var rv = $("#ringval"); if (rv) { rv.style.transition = "none"; rv.style.strokeDashoffset = String(339.29 * (1 - (+rv.dataset.p) / 100)); }
      $$("[data-w]").forEach(function (b) { b.style.transition = "none"; b.style.width = b.dataset.w + "%"; });
      try { window.print(); } catch (e) { /* blocked */ }
    };
    try { if (window.self !== window.top) $("#printhint").hidden = false; } catch (e) { $("#printhint").hidden = false; }
    $("#newattempt").onclick = function () {
      E.clear(); S = null; KEY = null; welcome();
    };
  }

  function respText(q, a) {
    if (q.type === "mcq") {
      if (!a.choice) return null;
      var o = q.options.filter(function (x) { return x.id === a.choice; })[0];
      return o ? o.text : null;
    }
    if (q.type === "tf") return a.choice ? (a.choice === "T" ? "True" : "False") : null;
    return a.text && a.text.trim() ? a.text : null;
  }

  function reviewItem(it) {
    var q = E.byId[it.id], k = KEY[it.id], a = it.answer || {};
    var p = E.part(q.part);
    var labels = { correct: "Correct", incorrect: "Incorrect", unanswered: "Unanswered", attempted: "Written · awaiting marking", notattempted: "Not attempted" };
    var marksTotal = it.autoMax + it.manualMax;
    var head = '<div class="ri-top"><span class="tag part p' + q.part + '">Q' + q.id + " · Part " + q.part + '</span><span class="tag marks">' + marksTotal + ' marks</span><span class="status st-' + it.status + '">' + labels[it.status] + "</span></div>" +
      '<div class="q">' + rich(q.text) + "</div>";
    var mid = "", end = "";
    var yours = respText(q, a);
    if (q.type === "mcq") {
      var correctOpt = q.options.filter(function (x) { return x.id === k.answer; })[0].text;
      mid = '<div class="ans-grid"><div class="abox ' + (it.status === "correct" ? "good" : it.status === "incorrect" ? "badbox" : "") + '"><small>Your response</small>' + (yours ? esc(yours) : "<i>No answer</i>") + "</div>" +
        '<div class="abox good"><small>Correct answer</small>' + esc(correctOpt) + "</div></div>";
      end = '<div class="expl"><small>Explanation (source answer key)</small><p>' + esc(k.explanation) + "</p></div>";
    } else if (q.type === "tf") {
      var corr = k.answer === "T" ? "True" : "False";
      mid = '<div class="ans-grid"><div class="abox ' + (it.status === "correct" ? "good" : it.status === "incorrect" ? "badbox" : "") + '"><small>Your response</small>' + (yours ? esc(yours) : "<i>No answer</i>") + "</div>" +
        '<div class="abox good"><small>Correct answer</small>' + corr + "</div></div>" +
        '<div class="abox" style="margin-top:10px"><small>Your reason (manual · ' + it.manualMax + ' mark)</small><div class="resp">' + (a.reason && a.reason.trim() ? esc(a.reason) : "<i>No reason written</i>") + "</div></div>";
      end = '<div class="expl"><small>Explanation (source answer key)</small><p>' + esc(k.explanation) + "</p></div>" +
        '<div class="markline">Reason marks awarded: <i></i> / ' + it.manualMax + "</div>";
    } else {
      mid = '<div class="abox"><small>Your answer</small><div class="resp">' + (yours ? esc(yours) : "<i>Not attempted</i>") + "</div></div>";
      end = '<div class="expl"><small>Model answer (source answer key)</small>' + k.model.map(function (t) { return "<p>" + esc(t) + "</p>"; }).join("") +
        '<small style="margin-top:12px">Marking points · 1 mark each</small><ul>' + k.marking.map(function (m) { return "<li>" + esc(m) + "</li>"; }).join("") + "</ul></div>" +
        '<div class="markline">Marks awarded by examiner: <i></i> / ' + it.manualMax + "</div>";
    }
    end += '<div class="fine">Guide reference (source): ' + esc(k.ref) + "</div>";
    return '<article class="ri">' + head + mid + end + "</article>";
  }

  /* ---------- Boot ---------- */
  window.addEventListener("pagehide", flushSave);
  document.addEventListener("visibilitychange", function () { if (document.hidden) flushSave(); });

  var saved = E.load();
  if (saved && saved.phase === "submitted") { S = saved; showReport(); }
  else welcome();
})();

</script>

@media print{.langbar{display:none}}
